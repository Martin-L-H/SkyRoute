<header class="header">
  <div class="container">
    <nav class="navbar">
      <div class="navbar-brand">
        <a routerLink="/" class="logo">
          ✈️ SkyRoute
        </a>
      </div>
      
      <button class="navbar-toggle" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>
      
      <div class="navbar-menu" [class.is-active]="isMenuOpen">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a routerLink="/" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Home</a>
          </li>
          <li class="nav-item">
            <a routerLink="/search" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Search Flights</a>
          </li>
          <li class="nav-item">
            <a routerLink="/flights" routerLinkActive="active" class="nav-link" (click)="closeMenu()">My Flights</a>
          </li>
          <li class="nav-item">
            <a routerLink="/booking" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Bookings</a>
          </li>
          <li class="nav-item">
            <a routerLink="/profile" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Profile</a>
          </li>
        </ul>
        
        <div class="navbar-actions">
          <button class="btn btn-secondary">Sign In</button>
          <button class="btn btn-primary">Sign Up</button>
        </div>
      </div>
    </nav>
  </div>
</header>
